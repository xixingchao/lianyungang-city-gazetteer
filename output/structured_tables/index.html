9, "status": "verified", "notes": "已据页级OCR回源核录：表题、表号和表头见 workbench/ocr/paddle_ocr/上/part02/page_0302.txt；续表内容见 workbench/ocr/paddle_ocr/上/part02/page_0303.txt，并参考 raw OCR workbench/table_entries/上/raw/LYG-上-T030_603.txt。原JSON串入气象降水蒸发数据；本次仅录入续页可见的海堤记录。团港段一行源页未单列终点，地点迄保留空值。", "vol": "上", "volume": "上", "rows": [["灌西盐场", "洋桥闸", "天生港", "20.20", "6~6.5", "5", "1:3", "1:3", "防浪墙4.1公里，石护坡4公里"], ["灌云县", "天生港", "炮阵地", "1.08", "6.5", "6", "1:3", "1:2", "块石护坡960米"], ["灌西盐场", "炮阵地", "运销站", "0.61", "6~6.5", "5", "1:3", "1:3", ""], ["", "运销站", "燕尾闸下", "0.49", "5.5", "3", "1:3", "1:3", "岸墙型式"], ["灌云县", "团港段", "", "2.18", "5.5", "3", "1:2", "1:2", ""], ["灌云县盐场", "六圩港西", "洋桥闸", "17.25", "4.5~5", "3", "1:4~1:8", "1:3", "在灌西盐场海堤外80~120米"]]}, {"table_id": "LYG-上-T031", "title": "海州湾渔场主要鱼类及渔期表续表", "table_number": "表12-1", "pages": [698, 699, 700], "page": 698, "part": "part03", "columns": ["类别", "种名", "地方名", "渔期和生长情况"], "row_count": 35, "col_count": 4, "status": "verified", "notes": "2026-10-03 按 300dpi 原件 上_3.pdf p698-700 逐格复核修订：补文蛤/青蛤/缢蛏三行（各行共享源表合并单元正文），杂色蛤/四角蛤地方名据原表清空，短蛸正文补全（原为占位说明）。", "vol": "上", "volume": "上", "rows": [["鱼类", "鳀鱼", "离水烂、马鲛食", "渔期全年都可捕到，5~6月产卵，是盛渔期；海州湾外围从北到南均有分布，资源量很大，个体小，食用价值、经济价值较低。"], ["鱼类", "带鱼", "镰刀鱼", "是海州湾渔场的最主要鱼种。渔期分春秋两季，春季个体大，鱼群密，4月下旬进入渔场，5~6月下旬是产卵期，形成汛期，此时的带鱼，又称伏带。秋季8~9月，个体小，鱼群分散，是索饵群体，鱼发中心偏外。因捕捞强度增加，资源遭到破坏，20世纪60年代末，已形不成渔汛。海州湾渔场的带鱼是黄海群系，不是东海群系。"], ["鱼类", "小带鱼", "带鱼丝", "渔汛在秋季。"], ["鱼类", "鲐鱼", "鲐鱼", "是海州湾渔场的重要鱼种，为远洋洄游性鱼类，来海州湾渔场的鲐鱼主要是产卵群体，渔期5月上旬到7月底，旺发期5月底到7月中旬，鱼发中心分布在20米等深线一带。"], ["鱼类", "蓝点鲅", "马鲛鱼", "是海州湾渔场的重要鱼种。是远洋洄游性鱼类。渔期分春秋两季，春季为产卵群体，4月下旬到6月上旬，5月为旺季，分布在海州湾10米到15米等深线一带；秋季是索饵群体，渔期9月中旬到10月下旬，10月为旺季，分布在海州湾外围20米等深线附近。"], ["鱼类", "鲳鱼", "鲳片鱼", "是洄游性中下层鱼类，海州湾是其产卵场所之一，渔期是4月到7月上旬。"], ["鱼类", "鲬", "狗腿鱼", "是海州湾常见鱼类，渔期3月底到6月中旬，旺汛是5月上中旬，分布在秦山东、连岛北的海底。"], ["鱼类", "虾虎鱼", "沙光鱼", "栖息在浅海盐池、虾塘、河沟里，常年都有。"], ["鱼类", "鲆、鲽", "比目鱼", "海州湾渔场的底栖鱼类，渔期3月到5月底，4月到5月上旬产卵，分布在10米到20米深的水域。"], ["鱼类", "真鲨", "九道箍", "渔期6~8月，产量少。"], ["鱼类", "双髻鲨", "锄头鲨", "渔期7~9月，产量不高。"], ["甲壳类", "东方对虾", "对虾", "是海州湾大型的名贵虾类，成熟后个体平均重100克，体长23厘米。海州湾对虾是黄海对虾群的一个分支，是产卵群体。渔期4月上旬到5月底，4月底5月初为旺期，分布在5~10米深泥质的海域中和河口海湾。"], ["甲壳类", "周氏新对虾", "羊毛虾、条虾", "是海州湾渔场产量较多的名贵虾类，肉质透明美观，渔期5月中旬到7月上旬，6月上中旬是旺汛，分布在连岛以北10米深的海域中。"], ["甲壳类", "鹰爪虾", "红虾、铁壳蟹、硬壳虾", "是海州湾渔场的一种名贵虾类，渔期5月中旬到7月上旬，6月上中旬是铁壳蟹旺汛，分布在连岛以北10米深的海域中，与周氏新对虾混栖。"], ["甲壳类", "中国毛虾", "虾皮", "是海州湾近海产量最多的小型虾类，渔期终年都有，6月产卵，是捕捞旺汛。7~8月，为了保护幼虾生长，禁捕两个月。实际生产时间，春季3~6月，秋季9~11月。"], ["甲壳类", "脊尾白虾", "白虾", "生长在河口海湾浅水咸淡水交汇处，渔期几乎全年都有。"], ["甲壳类", "三疣梭子蟹", "梭子蟹", "产卵前叫童蟹，体肥壮，肉鲜美，产卵后叫水蟹，体消瘦，是海州湾重要的蟹类，渔期分春秋两季，春季4~6月，主要捕童蟹，5月底至6月上旬产卵，秋季9~11月，主要是水蟹，但11月份的梭子蟹，体质已逐渐恢复趋于健壮。分布在海州湾15米等深线以内的所有浅海水域。"], ["环节动物", "沙蚕", "沙蚕", "穴居潮间带沙滩，是对虾的饵料。"], ["腔肠动物", "海蜇", "海蜇", "浮游性生物，近海重要捕捞对象，渔期6~8月。"], ["棘皮动物", "刺参", "海参", "分布在前三岛（平山、达山、车牛山）的水下20米岩石坡上附着生长，海州湾是其自然分布的最南边缘。3~5年成熟。成熟的个体重400~500克。一般秋冬季节捕捞。"], ["贝类", "杂色蛤", "", "分布在沙质浅海区和潮间带。用船、铁耙捕捞，或在落潮时用耙、锄、铲在沙滩捕捞，产量不多。"], ["贝类", "文蛤", "", "分布在沙质浅海区和潮间带。用船、铁耙捕捞，或在落潮时用耙、锄、铲在沙滩捕捞，产量不多。"], ["贝类", "青蛤", "", "分布在沙质浅海区和潮间带。用船、铁耙捕捞，或在落潮时用耙、锄、铲在沙滩捕捞，产量不多。"], ["贝类", "四角蛤", "", "分布在沙质浅海区和潮间带。用船、铁耙捕捞，或在落潮时用耙、锄、铲在沙滩捕捞，产量不多。"], ["贝类", "兰蛤", "海沙子", "分布在赣榆县海头镇以南，连云区西墅村西北，临洪河口外的泥质底潮间带。捕捞方法，落潮时涉足滩涂，用口袋连泥刮起。年产量1~2万吨，为养殖对虾的饵料，很少食用。"], ["贝类", "毛蚶", "", "分布在临洪河口外的泥质底浅海区，经济价值较高。"], ["贝类", "缢蛏", "", "分布在临洪河口外的泥质底浅海区，经济价值较高。"], ["贝类", "褶牡蛎", "海蛎子", "附着在潮间带的岩岸、石块或码头、船身上。"], ["贝类", "皱纹盘鲍", "鲍鱼", "分布在前三岛附近砾石底质表水海域中，是名贵海珍品，产量很少。"], ["贝类", "栉孔扇贝", "扇贝", "分布在前三岛附近砾石底质表水海域中，是名贵海珍品，产量很少。"], ["贝类", "红螺", "红螺", "分布在燕尾港东北10~30公里的浅海，底拖网捕鱼时常能捕到。"], ["贝类", "乌贼", "大乌贼", "有曼氏无针乌贼和金乌贼，是海州湾重要经济海产品，渔期5~6月，是产卵群体，一般个体重500克，主要分布在5~15米深的较清的水中，6月上旬在附着物上产卵后，亲体大部分死亡。"], ["贝类", "日本枪乌贼", "小乌贼", "产卵前仔满肚，故又名仔乌。是海州湾重要小型经济海产品，在海州湾近海产卵，渔期3~5月，主要分布在5~15米深的清水中。"], ["贝类", "长蛸", "八带鱼、望潮", "生长在浅海泥沙滩涂，冬天，穴居于泥中20厘米深处。渔期分春秋两季，春季3~5月，秋季9~11月。"], ["贝类", "短蛸", "短把头", "生长在浅海泥沙滩涂，冬天，穴居于泥中20厘米深处。渔期分春秋两季，春季3~5月，秋季9~11月。"]]}, {"table_id": "LYG-上-T032", "title": "1990年连云港市海洋捕捞分品种产量统计表", "table_number": "表12-6", "pages": [711, 712], "page": null, "part": null, "columns": ["品种", "合计(吨)", "国营渔轮捕捞量(吨)", "其它渔船捕捞量(吨)", "备注"] 分布在秦山、连岛、开山一带，以连岛到秦山一线水深5~6米，水色以白米色海域为中心产卵场。"], ["鱼类", "鲻鱼", "乌鲻", "是沿岸浅海河口咸淡水交汇区的鱼类，春秋皆有，秋季较多。"], ["鱼类", "鲈鱼", "鲈鱼", "生活于咸淡水交汇处，春秋皆有，秋季产卵，个体大的可达10公斤以上。"], ["鱼类", "真鲷", "加吉鱼", "是海州湾渔场名贵的鱼类，栖息在车牛山周围砾石沙底的清水中，海州湾是其产卵场，产卵期5月份。20世纪30年代中期以前，真鲷资源比较稳定，由于日本渔船连年拖网滥捕，30年代中期以后，资源被破坏而枯竭。50年代初，真鲷资源有所恢复，但年产量不过10~40吨。60年代后，国营渔轮不断进入海州湾底拖网禁渔线内拖网，致使资源又遭破坏。1978年10月，国营渔轮拖网大肆捕捞50克重的幼鱼，资源几乎灭绝。至1990年未见明显恢复。"], ["鱼类", "大黄鱼", "黄鱼", "海州湾为产卵场，渔期在5月上旬到7月，6月份产卵。海州湾是其分布的最北部边缘。"], ["鱼类", "小黄鱼", "黄花鱼、春鱼", "海州湾是产卵场，渔期4月到6月，5月是旺季。"], ["鱼类", "鮸鱼", "米鱼", "经济价值较高，个体体重可达5公斤，海州湾中南部均有分布，渔期在8~9月，但形不成渔汛。"], ["鱼类", "白姑鱼", "白果子", "海州湾常见鱼类之一，渔期5~11月，5月中旬到6月下旬在10米水深处产卵。"], ["鱼类", "黄姑鱼", "黄果鱼、黄鱼", "渔期5~7月下旬，海州湾近岸水域均有分布，在4~9米水深的海域产卵，产卵时集结成群。"], ["鱼类", "梅童鱼", "大头黄、黄巴头", "渔期3~10月，4~5月在近岸浅水区产卵集群。是常见的小型食用鱼类。近海定置张网的主要捕捞对象。"]]}, {"table_id": "LYG-上-T035", "title": "民国13~36年(1924~1947年)部分年份连云港市境内各盐场年产量统计表", "table_number": "表13-7", "pages": [749], "page": 749, "part": null, "columns": ["年份(民国)", "涛青场(吨)", "板浦场(吨)", "中正场(吨)", "济南场(吨)", "合计(吨)"], "row_count": 22, "col_count": 6, "status": "verified", "notes": "已据页级OCR回源核录：workbench/ocr/paddle_ocr/上/part03/page_0144.txt，并参考 raw OCR：workbench/table_entries/上/raw/LYG-上-T036_749.txt。原JSON列序误置为合计在前，本轮按源页列序重录为年份、涛青场、板浦场、中正场、济南场、合计，单位为吨。民国35年仅见中正场49736、济南场18344，其他栏及合计栏保留空值；民国36年各值按坐标OCR列位核定。 2026-10-04 复核：pages 原误记[743,745]（实为表13-5/13-6 页）；表13-7 主表真身=PDF页749（印刷页667），数据经与该页300dpi 图核对一致。", "vol": "上", "volume": "上", "rows": [["13", "42906", "78600", "93500", "325650", "540656"], ["14", "32050", "81350", "65350", "246350", "425100"], ["15", "15950", "74350", "52450", "220400", "363150"], ["16", "14100", "89400", "46250", "199900", "349650"], ["17", "21000", "93450", "48400", "244250", "407100"], ["18", "20550", "105500", "51000", "348250", "525300"], ["19", "7650", "30400", "35000", "21450", "94500"], ["20", "24500", "47800", "53700", "86650", "212650"], ["21", "44250", "83300", "116850", "168650", "413050"], ["22", "33250", "67550", "84000", "90200", "275000"], ["23", "30800", "885 function escape(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function filter(){
  const q=document.getElementById('search').value.toLowerCase();
  const vf=document.getElementById('volFilter').value;
  let items=TABLES;
  if(vf!=='all') items=items.filter(t=>t.volume===vf);
  if(q) items=items.filter(t=>(t.table_id+' '+t.title+' '+(t.table_number||'')).toLowerCase().includes(q));

    html+='</tr></thead><tbody>';
    for(const row of t.rows){
      html+='<tr>';

  }

}
